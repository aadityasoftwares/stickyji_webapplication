<span
  class="app-avatar"
  [ngClass]="avatarClasses"
  [style.--app-avatar-size]="resolvedSize"
  [attr.role]="decorative ? null : 'img'"
  [attr.aria-label]="accessibleLabel"
  [attr.aria-hidden]="decorative ? 'true' : null"
  [appTooltip]="resolvedTooltip"
  [tooltipDisabled]="!hasCustomTooltip"
  [tooltipPosition]="tooltipPosition"
  [tooltipTone]="tooltipTone"
  [tooltipSize]="tooltipSize"
>
  @if (hasImage) {
    <img
      class="app-avatar-image"
      [src]="src!"
      alt=""
      [attr.loading]="loading"
      [attr.referrerpolicy]="referrerPolicy"
      [style.object-position]="objectPosition"
      (load)="handleImageLoad($event)"
      (error)="handleImageError($event)"
    />
  } @else if (fallbackIcon) {
    <span class="app-avatar-icon" aria-hidden="true">
      <app-icon [icon]="fallbackIcon" size="inherit" />
    </span>
  } @else {
    <span class="app-avatar-initials" aria-hidden="true">
      {{ resolvedInitials }}
    </span>
  }

  @if (status !== 'none') {
    <span
      class="app-avatar-status"
      [ngClass]="'app-avatar-status-' + status"
      aria-hidden="true"
    ></span>
  }
</span>
