@if (open) {
  <div class="delete-confirm-backdrop" (mousedown)="onBackdrop($event)">
    <section
      class="delete-confirm-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="delete-confirm-title"
      aria-describedby="delete-confirm-message"
      (mousedown)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="delete-confirm-close"
        aria-label="Close"
        [disabled]="busy"
        (click)="close()"
      >
        <app-icon [icon]="LucideX" size="sm" />
      </button>
      <div
        class="delete-confirm-icon"
        [class.is-permanent]="mode === 'permanent'"
        aria-hidden="true"
      >
        <app-icon
          [icon]="mode === 'permanent' ? LucideTriangleAlert : LucideArchiveRestore"
          size="md"
        />
      </div>
      <span class="delete-confirm-kicker">{{
        mode === 'permanent' ? 'Permanent action' : 'Safe delete'
      }}</span>
      <h2 id="delete-confirm-title">{{ title }}</h2>
      @if (itemName) {
        <div class="delete-confirm-item">{{ itemName }}</div>
      }
      <p id="delete-confirm-message">{{ message }}</p>
      @if (supportingText) {
        <div class="delete-confirm-support" [class.is-permanent]="mode === 'permanent'">
          <app-icon [icon]="mode === 'permanent' ? LucideTrash2 : LucideArchiveRestore" size="xs" />
          <span>{{ supportingText }}</span>
        </div>
      }
      <div class="delete-confirm-actions">
        <app-button
          [label]="cancelLabel"
          variant="secondary"
          size="sm"
          [disabled]="busy"
          (buttonClick)="close()"
        />
        <app-button
          [label]="confirmLabel"
          [variant]="confirmVariant"
          size="sm"
          [loading]="busy"
          [disabled]="busy"
          (buttonClick)="confirm()"
        />
      </div>
    </section>
  </div>
}
