<app-modal
  [open]="open"
  [title]="title"
  [eyebrow]="resolvedEyebrow"
  [icon]="headerIcon"
  [tone]="resolvedTone"
  size="sm"
  [maxWidth]="maxWidth"
  [busy]="busy"
  [fullscreenOnMobile]="false"
  [ariaLabel]="title"
  (closed)="close()"
>
  <div modal-body class="delete-confirm-body">
    @if (itemName) {
      <div class="delete-confirm-item" [attr.title]="itemName">
        {{ itemName }}
      </div>
    }

    @if (message) {
      <p class="delete-confirm-message">{{ message }}</p>
    }

    @if (supportingText) {
      <div class="delete-confirm-support" [class.is-permanent]="mode === 'permanent'">
        <span class="delete-confirm-support-icon" aria-hidden="true">
          <app-icon [icon]="supportIcon" size="xs" />
        </span>
        <span class="delete-confirm-support-text">{{ supportingText }}</span>
      </div>
    }
  </div>

  <div modal-footer class="delete-confirm-actions">
    <app-button
      [label]="cancelLabel"
      variant="secondary"
      size="sm"
      [disabled]="busy"
      (buttonClick)="close()"
    />
    <app-button
      [label]="confirmLabel"
      [variant]="confirmVariant"
      size="sm"
      [loading]="busy"
      [disabled]="busy"
      (buttonClick)="confirm()"
    />
  </div>
</app-modal>
