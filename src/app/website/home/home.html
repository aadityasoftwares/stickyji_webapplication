<app-website-header
  (signInClick)="navigateToAuth('login')"
  (primaryActionClick)="navigateToAuth('signup')"
></app-website-header>
<main>
  <app-hero (startFree)="navigateToAuth('signup')"></app-hero>
  <app-thought-flow appScrollReveal (exploreClick)="navigateToAuth('signup')"></app-thought-flow>
  <app-use-cases appScrollReveal (startClick)="navigateToAuth('signup')"></app-use-cases>
  <app-reviews appScrollReveal></app-reviews>

  <app-faq appScrollReveal></app-faq>

  <app-subscription appScrollReveal (planSelected)="choosePlan($event)"></app-subscription>
</main>
<app-website-footer
  appScrollReveal
  (primaryActionClick)="navigateToAuth('signup')"
  (secondaryActionClick)="navigateToAuth('login')"
></app-website-footer>
