<div class="members-stack" role="group" [attr.aria-label]="stackLabel" [attr.data-size]="sizeName"
    [attr.data-shape]="shape" [class.is-interactive]="interactive" [class.is-disabled]="disabled"
    [style.--members-stack-overlap.px]="overlap" [style.--members-stack-custom-size.px]="customSize">

    @for (
    member of visibleMembers;
    track member.id;
    let index = $index
    ) {
    @if (interactive) {
    <button class="members-stack-item" type="button" [style.z-index]="itemZIndex(index)"
        [disabled]="disabled || (member.disabled ?? false)" [attr.aria-label]="memberTitle(member)"
        [attr.title]="memberTitle(member)" (click)="selectMember(member, $event)">

        <app-avatar [src]="member.src ?? null" [name]="member.name" [alt]="member.alt ?? member.name"
            [initials]="member.initials ?? ''" [size]="size" [tone]="resolvedTone(member)" [shape]="shape"
            [status]="member.status ?? 'none'" [bordered]="bordered" [elevated]="elevated" [decorative]="true" />
    </button>
    } @else {
    <span class="members-stack-item" [style.z-index]="itemZIndex(index)" [attr.title]="memberTitle(member)">

        <app-avatar [src]="member.src ?? null" [name]="member.name" [alt]="member.alt ?? member.name"
            [initials]="member.initials ?? ''" [size]="size" [tone]="resolvedTone(member)" [shape]="shape"
            [status]="member.status ?? 'none'" [bordered]="bordered" [elevated]="elevated" />
    </span>
    }
    }

    @if (hasOverflow) {
    @if (interactive) {
    <button class="members-stack-item members-stack-overflow" type="button" [style.z-index]="1" [disabled]="disabled"
        [attr.aria-label]="overflowTitle()" [attr.title]="overflowTitle()" (click)="selectOverflow($event)">

        <app-avatar [name]="overflowTitle()" [initials]="overflowInitials()" [size]="size" tone="neutral"
            [shape]="shape" [bordered]="bordered" [elevated]="elevated" [decorative]="true" />
    </button>
    } @else {
    <span class="members-stack-item members-stack-overflow" [style.z-index]="1" [attr.title]="overflowTitle()">

        <app-avatar [name]="overflowTitle()" [initials]="overflowInitials()" [size]="size" tone="neutral"
            [shape]="shape" [bordered]="bordered" [elevated]="elevated" />
    </span>
    }
    }
</div>
