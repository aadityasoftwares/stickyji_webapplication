<div
  class="app-shell"
  [class.sidebar-collapsed]="sidebarCollapsed()"
  [class.mobile-sidebar-open]="mobileSidebarOpen()"
>
  <app-sidebar
    id="app-sidebar"
    class="shell-sidebar"
    [collapsed]="sidebarCollapsed()"
    [mobileOpen]="mobileSidebarOpen()"
    [workspaceId]="activeWorkspaceId()"
    [workspaces]="sidebarWorkspaces()"
    [loadingWorkspaces]="loadingWorkspaces()"
    [loggingOut]="loggingOut()"
    (collapsedChange)="setSidebarCollapsed($event)"
    (mobileClosed)="closeMobileSidebar()"
    (workspaceChange)="onWorkspaceChange($event)"
    (logout)="logout()"
  />

  <button
    class="sidebar-scrim"
    type="button"
    tabindex="-1"
    aria-label="Close navigation"
    [attr.aria-hidden]="!mobileSidebarOpen()"
    (click)="closeMobileSidebar()"
  ></button>

  <section class="shell-main">
    <header class="mobile-navigation-bar">
      <app-button
        #mobileMenuButton
        variant="ghost"
        size="sm"
        [iconOnly]="true"
        [icon]="LucideMenu"
        ariaLabel="Open navigation"
        ariaControls="app-sidebar"
        [ariaExpanded]="mobileSidebarOpen()"
        (buttonClick)="openMobileSidebar()"
      />
      <img src="StickyJiHorizontalLogo.png" alt="Sticky Ji" />
    </header>
    <main id="main-content" class="app-content" tabindex="-1">
      <router-outlet />
    </main>
  </section>
</div>
