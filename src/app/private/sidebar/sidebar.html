<aside
  class="sidebar"
  [class.is-collapsed]="compact"
  [class.is-mobile-open]="mobileOpen"
  aria-label="Primary navigation"
>
  <header class="brand-row">
    <a
      class="brand-link"
      [routerLink]="routes.TODAY"
      aria-label="Sticky Ji home"
      (click)="closeMobileNavigation()"
    >
      <img src="StickyJiHorizontalLogo.png" alt="Sticky Ji" class="brand-logo-expanded" />
      <img src="StickyJiLogo.png" alt="Sticky Ji" class="brand-logo-collapsed" />
    </a>
    <app-button
      class="sidebar-toggle"
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      [icon]="compact ? LucidePanelLeftOpen : LucidePanelLeftClose"
      [ariaLabel]="compact ? 'Expand sidebar' : 'Collapse sidebar'"
      [ariaExpanded]="!collapsed"
      ariaControls="sidebar-content"
      (buttonClick)="toggleCollapsed()"
    />
    <app-button
      class="mobile-close"
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      [icon]="LucideX"
      ariaLabel="Close navigation"
      (buttonClick)="closeMobileNavigation()"
    />
  </header>

  <nav id="sidebar-content" class="sidebar-navigation" aria-label="Application navigation">
    @for (group of mainGroups; track group.label; let groupIndex = $index) {
      <section class="navigation-group" [attr.aria-label]="group.label">
        <div class="section-heading">
          <span class="section-label">{{ group.label }}</span>
          <app-button
            variant="ghost"
            size="xs"
            [iconOnly]="true"
            [icon]="isGroupExpanded(group.label) ? LucideChevronDown : LucideChevronRight"
            [ariaLabel]="(isGroupExpanded(group.label) ? 'Collapse ' : 'Expand ') + group.label"
            [ariaExpanded]="isGroupExpanded(group.label)"
            [ariaControls]="'sidebar-group-' + groupIndex"
            (buttonClick)="toggleGroup(group.label)"
          />
        </div>
        <div
          class="nav-list"
          [id]="'sidebar-group-' + groupIndex"
          [hidden]="!isGroupExpanded(group.label)"
        >
          @for (item of group.items; track item.route) {
            <a
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="activeMatchOptions"
              ariaCurrentWhenActive="page"
              [attr.aria-label]="item.label"
              [appTooltip]="item.label"
              tooltipPosition="right"
              tooltipTrigger="hover-focus"
              [tooltipDisabled]="!compact"
              (click)="closeMobileNavigation()"
            >
              <span class="nav-icon" aria-hidden="true"
                ><app-icon [icon]="item.icon" size="sm"
              /></span>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          }
        </div>
      </section>
    }

  <footer class="sidebar-footer" aria-label="Account">
    <div class="section-heading">
      <span class="section-label">Account</span>
      <app-button
        variant="ghost"
        size="xs"
        [iconOnly]="true"
        [icon]="isGroupExpanded('Account') ? LucideChevronDown : LucideChevronRight"
        [ariaLabel]="isGroupExpanded('Account') ? 'Collapse Account' : 'Expand Account'"
        [ariaExpanded]="isGroupExpanded('Account')"
        ariaControls="sidebar-account"
        (buttonClick)="toggleGroup('Account')"
      />
    </div>
    <div id="sidebar-account" class="nav-list" [hidden]="!isGroupExpanded('Account')">
      @for (item of accountItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="activeMatchOptions"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="item.label"
          [appTooltip]="item.label"
          tooltipPosition="right"
          tooltipTrigger="hover-focus"
          [tooltipDisabled]="!compact"
          (click)="closeMobileNavigation()"
        >
          <span class="nav-icon" aria-hidden="true"><app-icon [icon]="item.icon" size="sm" /></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
      <app-button
        class="logout-item"
        variant="ghost"
        size="sm"
        [fullWidth]="true"
        [iconOnly]="compact"
        [iconLeft]="LucideLogOut"
        [icon]="LucideLogOut"
        label="Logout"
        [loading]="loggingOut"
        loadingText="Logging out..."
        ariaLabel="Logout"
        appTooltip="Logout"
        tooltipPosition="right"
        tooltipTrigger="hover-focus"
        [tooltipDisabled]="!compact"
        (buttonClick)="requestLogout()"
      />
    </div>
  </footer>
</aside>
