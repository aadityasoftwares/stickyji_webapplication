<aside
  class="sidebar"
  [class.is-collapsed]="collapsed"
  [class.is-mobile-open]="mobileOpen"
  aria-label="Primary navigation"
>
  <!-- =====================================================
         BRAND
    ====================================================== -->

  <header class="brand-row">
    <a
      class="brand-link"
      routerLink="/app/today"
      aria-label="Sticky Ji home"
      (click)="closeMobileNavigation()"
    >
      <img src="StickyJiHorizontalLogo.png" alt="Sticky Ji" class="brand-logo-expanded" />

      <img src="StickyJiLogo.png" alt="Sticky Ji" class="brand-logo-collapsed" />
    </a>

    <button
      class="mobile-close"
      type="button"
      aria-label="Close navigation"
      (click)="mobileClosed.emit()"
    >
      <app-icon [icon]="LucideX" size="sm" />
    </button>
  </header>

  <!-- =====================================================
         WORKSPACE SELECTOR
    ====================================================== -->

  <!-- <section class="workspace-section" aria-label="Current workspace">

        <div class="workspace-select-shell" [attr.title]="
                collapsed
                    ? activeWorkspaceLabel
                    : null
            ">

            <app-select class="workspace-select" ariaLabel="Switch workspace" placeholder="Select workspace"
                searchPlaceholder="Search workspaces..." emptyText="No workspaces found"
                loadingText="Loading workspaces..." eyebrow="Current workspace" dropdownTitle="Switch workspace"
                dropdownDescription="Choose where you want to organize your notes." size="sm" variant="workspace"
                placement="auto" [options]="workspaces" [ngModel]="workspaceId" [searchable]="true" [clearable]="false"
                [loading]="loadingWorkspaces" [fullWidth]="true" (ngModelChange)="
                    onWorkspaceChange($event)
                " />

        </div>

    </section> -->

  <!-- =====================================================
         COMMON DASHED DIVIDER
    ====================================================== -->

  <app-divider
    class="workspace-divider"
    variant="neutral"
    lineStyle="dashed"
    spacing="sm"
    inset="sm"
    [decorative]="true"
  />

  <!-- =====================================================
         NAVIGATION
    ====================================================== -->

  <nav class="sidebar-navigation" aria-label="Application navigation">
    @for (
      group of navigationGroups;
      track group.label;
      let groupIndex = $index;
      let lastGroup = $last
    ) {
      <section class="navigation-group" [attr.aria-labelledby]="'sidebar-group-' + groupIndex">
        <!-- =================================================
                     GROUP TITLE
                ================================================== -->

        <p class="section-label" [id]="'sidebar-group-' + groupIndex">
          {{ group.label }}
        </p>

        <!-- =================================================
                     ITEMS
                ================================================== -->

        <div class="nav-list">
          @for (item of group.items; track item.route) {
            <a
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{
                exact: true,
              }"
              ariaCurrentWhenActive="page"
              [attr.title]="collapsed ? item.label : null"
              (click)="closeMobileNavigation()"
            >
              <!-- Active marker -->

              <span class="nav-active-marker" aria-hidden="true"> </span>

              <!-- Icon -->

              <span class="nav-icon" aria-hidden="true">
                <app-icon [icon]="item.icon" size="sm" />
              </span>

              <!-- Label -->

              <span class="nav-label">
                {{ item.label }}
              </span>
            </a>
          }
        </div>
      </section>

      <!-- =================================================
                 DASHED DIVIDER BETWEEN GROUPS
            ================================================== -->

      @if (!lastGroup) {
        <app-divider
          class="navigation-divider"
          variant="neutral"
          lineStyle="dashed"
          spacing="sm"
          inset="sm"
          [decorative]="true"
        />
      }
    }
  </nav>

  <!-- =====================================================
         FOOTER
    ====================================================== -->

  <footer class="sidebar-footer">
    <!-- Common dashed divider -->

    <app-divider
      class="logout-divider"
      variant="neutral"
      lineStyle="dashed"
      spacing="sm"
      inset="sm"
      [decorative]="true"
    />

    <!-- Logout -->

    <button
      class="nav-item logout-item"
      type="button"
      [attr.title]="collapsed ? 'Logout' : null"
      aria-label="Logout"
      (click)="requestLogout()"
    >
      <span class="nav-icon" aria-hidden="true">
        <app-icon [icon]="LucideLogOut" size="sm" />
      </span>

      <span class="nav-label"> Logout </span>
    </button>
  </footer>

  <!-- =====================================================
         COLLAPSE BUTTON
    ====================================================== -->

  <button
    class="sidebar-toggle"
    type="button"
    [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!collapsed"
    (click)="toggleCollapsed()"
  >
    <app-icon [icon]="collapsed ? LucidePanelLeftOpen : LucidePanelLeftClose" size="xs" />
  </button>
</aside>
