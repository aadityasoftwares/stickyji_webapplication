
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching the main HTML file
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Hide Nginx version
    server_tokens off;
}
