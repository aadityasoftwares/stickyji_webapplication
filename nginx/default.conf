
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular outputHashing=all: content changes always produce a new URL.
    location ~ "^/(main|styles|scripts|chunk)-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Missing chunks must return 404, never the SPA HTML fallback.
    location ~* \.(js|css|woff2?|png|jpe?g|gif|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Angular application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching the main HTML file
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Hide Nginx version
    server_tokens off;
}
