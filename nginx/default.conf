# conf.d is included inside nginx's http block.
# Only canonical production marketing URLs may be indexed.
map "$host:$request_uri" $seo_robots {
    default "noindex, follow";
    ~^stickyji\.com:/(features|how-it-works|use-cases|pricing|about-us|contact-us)?(\?.*)?$ "";
}

server {
    listen 80;
    server_name www.stickyji.com;
    return 301 https://stickyji.com$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Robots-Tag $seo_robots always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Canonical path normalization; queries (including invitation tokens) are preserved.
    location ~ ^/(features|how-it-works|use-cases|pricing|about-us|contact-us|privacy-policy|terms-and-conditions|reviews)/index\.html$ { return 301 /$1$is_args$args; }
    rewrite ^/(.+)/$ /$1 permanent;
    location = /index.html { return 301 /$is_args$args; }
    location = /home { return 301 /$is_args$args; }
    location = /about { return 301 /about-us$is_args$args; }
    location = /contact { return 301 /contact-us$is_args$args; }
    location = /privacy { return 301 /privacy-policy$is_args$args; }
    location = /terms { return 301 /terms-and-conditions$is_args$args; }
    location = /stories { return 301 /reviews$is_args$args; }
    location = /auth { return 302 /auth/login$is_args$args; }

    location = / { try_files /index.html =404; }
    location ~ ^/(features|how-it-works|use-cases|pricing|about-us|contact-us|privacy-policy|terms-and-conditions|reviews)$ {
        try_files $uri/index.html =404;
    }

    # Known browser routes receive only the noindex CSR shell. APIs still enforce auth.
    location ~ ^/(auth/(login|signup|forgot-password|reset-password)|workspace-invitations/accept|app(/(today|workspaces(/(my|trash))?|workspacefolders(/(my|trash))?|account(/(profile|preferences))?|workspace(/(members|roles-permissions))?|sticky-?notes(/(my|trash|favorites))?))?)$ {
        try_files /index.csr.html =404;
    }
    location ~ ^/showcase(/.*)?$ { try_files /index.csr.html =404; }

    location = /index.csr.html { internal; }
    error_page 404 /404/index.html;
    location = /404/index.html { internal; }
    location = /404 { return 404; }

    location ~ "^/(main|styles|scripts|chunk)-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $seo_robots always;
        access_log off;
    }
    location ~* \.(js|css|woff2?|png|jpe?g|gif|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Robots-Tag $seo_robots always;
    }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
    location / { return 404; }
}
